name: Publish Foundry module

on:
  push:
    branches: [main]
    paths:
      - module.json
      - scripts/**
      - styles/**
      - assets/**
      - lang/**
      - README.md
      - LICENSE
      - .github/workflows/publish.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: foundry-module-release
  cancel-in-progress: false

jobs:
  package-and-release:
    name: Build ZIP and publish GitHub Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Validate module and sources
        shell: bash
        run: |
          set -euo pipefail
          for source in scripts/*.mjs; do node --check "$source"; done
          if compgen -G "tests/*.test.mjs" > /dev/null; then node --test tests/*.test.mjs; fi
          python3 - <<'PY'
          import json
          import pathlib
          import re

          manifest = json.loads(pathlib.Path("module.json").read_text(encoding="utf-8"))
          assert manifest["id"] == "silber-hud-overhaul", "Unexpected module ID"
          assert re.fullmatch(r"[0-9]+\.[0-9]+\.[0-9]+", manifest["version"]), "Use x.y.z version format"
          for filename in (
              manifest.get("esmodules", [])
              + manifest.get("styles", [])
              + [entry["path"] for entry in manifest.get("languages", [])]
          ):
              assert pathlib.Path(filename).is_file(), f"Missing module file: {filename}"
          assert manifest["manifest"] == (
              "https://github.com/Shining-Moon-54/silbers-HUD-Overhaul/"
              "releases/latest/download/module.json"
          ), "Manifest must use the stable release URL"
          PY

      - name: Assemble Foundry installation archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          version="$(python3 -c 'import json; print(json.load(open("module.json"))["version"])')"
          echo "RELEASE_TAG=v${version}" >> "$GITHUB_ENV"

          # The released manifest and archive point to this immutable release.
          python3 - <<'PY'
          import json
          from pathlib import Path

          path = Path("module.json")
          manifest = json.loads(path.read_text(encoding="utf-8"))
          version = manifest["version"]
          manifest["download"] = (
              "https://github.com/Shining-Moon-54/silbers-HUD-Overhaul/"
              f"releases/download/v{version}/silber-hud-overhaul.zip"
          )
          path.write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          PY

          cp module.json dist/module.json
          # Package all files declared by module.json, plus the module's assets.
          # Never hard-code CSS names: a new visual theme must be included automatically.
          python3 - <<'PY'
          import json
          from pathlib import Path
          from zipfile import ZIP_DEFLATED, ZipFile

          manifest = json.loads(Path("module.json").read_text(encoding="utf-8"))
          paths = ["module.json", "README.md", "LICENSE"]
          paths += [str(p) for p in Path("scripts").rglob("*.mjs") if p.is_file()]
          paths += manifest.get("esmodules", [])
          paths += manifest.get("styles", [])
          paths += [lang["path"] for lang in manifest.get("languages", [])]
          paths += [str(p) for p in Path("assets").rglob("*") if p.is_file()]
          with ZipFile("dist/silber-hud-overhaul.zip", "w", ZIP_DEFLATED, compresslevel=9) as z:
              for name in dict.fromkeys(paths):
                  path = Path(name)
                  if not path.is_file():
                      raise SystemExit(f"Missing release file: {name}")
                  z.write(path, arcname=name)
          PY
          unzip -t dist/silber-hud-overhaul.zip

      - name: Publish versioned release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists. Updating its assets to match the current manifest."
            gh release upload "$RELEASE_TAG" \
              dist/silber-hud-overhaul.zip \
              dist/module.json \
              --repo "$GITHUB_REPOSITORY" --clobber
            exit 0
          fi

          gh release create "$RELEASE_TAG" \
            dist/silber-hud-overhaul.zip \
            dist/module.json \
            --repo "$GITHUB_REPOSITORY" \
            --title "Silber HUD Overhaul $RELEASE_TAG" \
            --target "$GITHUB_SHA" \
            --generate-notes \
            --latest
